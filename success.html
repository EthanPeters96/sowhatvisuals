<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Message Sent - SowhatVisuals</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=swap"
      rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Montserrat', sans-serif;
        background-color: #000000;
        color: #ffffff;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }

      .success-container {
        text-align: center;
        max-width: 600px;
        padding: 3rem;
      }

      .success-icon {
        font-size: 4rem;
        color: #ffffff;
        margin-bottom: 2rem;
        animation: checkmark 0.6s ease-in-out;
      }

      @keyframes checkmark {
        0% {
          transform: scale(0) rotate(0deg);
        }
        50% {
          transform: scale(1.3) rotate(180deg);
        }
        100% {
          transform: scale(1) rotate(360deg);
        }
      }

      .success-title {
        font-size: 2.5rem;
        font-weight: 800;
        margin-bottom: 1rem;
        color: #ffffff;
      }

      .success-message {
        font-size: 1.2rem;
        font-weight: 700;
        margin-bottom: 3rem;
        line-height: 1.6;
        color: #cccccc;
      }

      .back-button {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        background-color: #ffffff;
        color: #000000;
        padding: 1rem 2rem;
        border: none;
        border-radius: 0;
        font-family: 'Montserrat', sans-serif;
        font-weight: 700;
        font-size: 1rem;
        text-decoration: none;
        transition: all 0.3s ease;
        cursor: pointer;
      }

      .back-button:hover {
        background-color: #cccccc;
        transform: translateY(-2px);
      }

      .back-button i {
        font-size: 1.1rem;
      }

      @media (max-width: 768px) {
        .success-title {
          font-size: 2rem;
        }

        .success-message {
          font-size: 1rem;
        }

        .success-container {
          padding: 2rem 1rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="success-container">
      <div class="success-icon">
        <i class="fas fa-check-circle"></i>
      </div>
      <h1 class="success-title">Message Sent!</h1>
      <p class="success-message">
        Thank you for reaching out! Your message has been successfully delivered. I'll get back to
        you within 24 hours to discuss your project and next steps.
      </p>
      <a href="/" class="back-button">
        <i class="fas fa-arrow-left"></i>
        Back to Website
      </a>
    </div>
  </body>
</html>
